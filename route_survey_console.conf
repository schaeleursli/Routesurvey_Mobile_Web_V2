<VirtualHost *:80>
    ServerName route-survey.survys.com
    ServerAlias www.route-survey.survys.com
    
    # Redirect all HTTP traffic to HTTPs
    Redirect / https://route-survey.survys.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName route-survey.survys.com
    ServerAlias www.route-survey.survys.com
    DocumentRoot /var/www/route_survey_console

    <Directory /var/www/route_survey_console>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

	# RewriteRules moved here
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . index.html [L]
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/route-survey.survys_error.log
    CustomLog ${APACHE_LOG_DIR}/route-survey.survys_access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/route-survey.survys.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/route-survey.survys.com/privkey.pem
</VirtualHost>
